# PostgreSQL для разработки: docker compose up -d
# Логин, пароль и имя БД берутся из backend/.env (см. backend/.env.example)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
